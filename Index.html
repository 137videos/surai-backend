<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SurAI Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3fbf9;
    --bg-soft: #ffffff;
    --card: #ffffff;
    --card-edge: #dcecee;
    --blue: #6cc8ef;
    --green: #7fdba0;
    --pink: #f598c3;
    --text: #203042;
    --text-dim: #72828f;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Hind', sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  h1, h2, .brand { font-family: 'Baloo 2', sans-serif; }

  .glow-field {
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 20% 10%, rgba(108,200,239,0.35), transparent 50%),
      radial-gradient(circle at 82% 15%, rgba(127,219,160,0.3), transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(245,152,195,0.25), transparent 55%);
    padding: 48px 20px 30px;
    text-align: center;
  }

  .wave-orb {
    width: 64px;
    height: 64px;
    margin: 0 auto 14px;
    border-radius: 50%;
    background: linear-gradient(160deg, var(--blue), var(--green));
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    box-shadow: 0 0 36px 8px rgba(108,200,239,0.4);
  }
  .wave-orb span {
    display: block;
    width: 4px;
    border-radius: 2px;
    background: #ffffff;
    animation: bounce 1.1s ease-in-out infinite;
  }
  .wave-orb span:nth-child(1) { height: 14px; animation-delay: 0s; }
  .wave-orb span:nth-child(2) { height: 24px; animation-delay: 0.15s; }
  .wave-orb span:nth-child(3) { height: 32px; animation-delay: 0.3s; }
  .wave-orb span:nth-child(4) { height: 22px; animation-delay: 0.45s; }
  .wave-orb span:nth-child(5) { height: 12px; animation-delay: 0.6s; }
  @keyframes bounce {
    0%, 100% { transform: scaleY(0.6); }
    50% { transform: scaleY(1.2); }
  }
  @media (prefers-reduced-motion: reduce) {
    .wave-orb span { animation: none; }
  }
  .brand { font-size: 30px;
    font-weight: 800;
    margin: 0;
    letter-spacing: 0.3px;
  }
  .tagline {
    color: var(--text-dim);
    margin: 8px 0 0;
    font-size: 15px;
  }

  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 20px 48px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 20px;
    padding: 26px 22px;
    margin-top: 22px;
  }
  .card h2 {
    margin: 0 0 4px;
    font-size: 21px;
    font-weight: 700;
  }
  .card .sub {
    color: var(--text-dim);
    font-size: 14px;
    margin: 0 0 20px;
  }

  label {
    display: block;
    font-size: 14px;
    color: var(--text-dim);
    margin: 18px 0 8px;
  }
  label:first-of-type { margin-top: 0; }

  input, select, textarea {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid var(--card-edge);
    border-radius: 12px;
    background: var(--bg-soft);
    color: var(--text);
    font-size: 16px;
    font-family: inherit;
  }
  input::placeholder, textarea::placeholder { color: #7c6a99; }
  textarea { height: 104px; resize: vertical; }
  select {
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--blue) 50%), linear-gradient(135deg, var(--blue) 50%, transparent 50%);
    background-position: calc(100% - 20px) center, calc(100% - 15px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }
  input:focus, select:focus, textarea:focus {
    outline: 2px solid var(--blue);
    outline-offset: 1px;
  }

  button {
    width: 100%;
    padding: 16px;
    margin-top: 24px;
    border: 0;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--blue), var(--green) 50%, var(--pink));
    background-size: 180% 100%;
    background-position: 0% 0%;
    color: #ffffff;
    font-size: 16px;
    font-weight: 700;
    font-family: 'Baloo 2', sans-serif;
    letter-spacing: 0.3px;
    cursor: pointer;
    box-shadow: 0 10px 24px -8px rgba(108,200,239,0.6);
    transition: background-position 0.4s ease;
  }
  button:hover { background-position: 100% 0%; }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

  .status {
    margin-top: 14px;
    font-size: 13.5px;
    color: var(--text-dim);
    line-height: 1.6;
    min-height: 1.4em;
  }
  .track {
    margin-top: 16px;
    padding: 14px;
    border-radius: 14px;
    background: var(--bg-soft);
    border: 1px solid var(--card-edge);
  }
  .track-title {
    margin: 0 0 8px;
    font-weight: 600;
    font-size: 14.5px;
  }
  .track audio { width: 100%; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }

  footer {
    text-align: center;
    padding: 10px 20px 30px;
    color: var(--text-dim);
    font-size: 12.5px;
  }
</style>
</head>
<body>

<div class="glow-field">
  <div class="wave-orb" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
  <h1 class="brand">SurAI Studio</h1>
  <p class="tagline">अपनी आवाज़, अपने बोल — AI से बना अपना गाना</p>
</div>

<main>
  <div class="card">
    <h2>अपना नया गाना बनाएं</h2>
    <p class="sub">नाम, बोल और स्टाइल भरें — बाकी हम संभालते हैं</p>

    <label for="title">गाने का नाम</label>
    <input id="title" placeholder="जैसे: माँ शेरावाली">

    <label for="lyrics">गाने के बोल या आइडिया</label>
    <textarea id="lyrics" placeholder="अपने गाने के बोल या कहानी लिखें..."></textarea>

    <label for="style">म्यूजिक स्टाइल</label>
    <select id="style">
      <option>Indian Pop + DJ + Full Bass</option>
      <option>माता रानी भजन DJ Mix</option>
      <option>खाटू श्याम भजन</option>
      <option>कृष्ण भजन</option>
      <option>महादेव भजन</option>
    </select>

    <label for="voice">आवाज़</label>
    <select id="voice">
      <option>Male Vocal</option>
      <option>Female Vocal</option>
      <option>Male + Female Duet</option>
      <option>Instrumental Only</option>
    </select>

    <button id="makeBtn" onclick="makeSong()">गाना बनाने की रिक्वेस्ट भेजें</button>
    <p id="status" class="status"></p>
    <div id="result"></div>
  </div>
</main>

<footer>© 2026 SurAI Studio</footer>

<script>
const BACKEND_URL = '';

async function makeSong(){
  const title = document.getElementById('title').value.trim();
  const lyrics = document.getElementById('lyrics').value.trim();
  const style = document.getElementById('style').value;
  const voice = document.getElementById('voice').value;
  const status = document.getElementById('status');
  const btn = document.getElementById('makeBtn');
  const result = document.getElementById('result');

  if(!title || !lyrics){
    status.textContent = 'कृपया गाने का नाम और बोल या आइडिया लिखें।';
    return;
  }

  result.innerHTML = '';
  btn.disabled = true;
  status.textContent = 'रिक्वेस्ट भेजी जा रही है...';

  try {
    const res = await fetch(`${BACKEND_URL}/api/generate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, lyrics, style, voice })
    });
    const data = await res.json();
    if(!res.ok || !data.taskId){
      status.textContent = 'गड़बड़ी: ' + (data.error || 'कुछ गलत हुआ, दोबारा कोशिश करें।');
      btn.disabled = false;
      return;
    }
    status.textContent = 'गाना बन रहा है... (इसमें 30-60 सेकंड लग सकते हैं)';
    pollStatus(data.taskId);
  } catch(err){
    status.textContent = 'नेटवर्क एरर, दोबारा कोशिश करें।';
    btn.disabled = false;
  }
}

function pollStatus(taskId){
  const status = document.getElementById('status');
  const btn = document.getElementById('makeBtn');
  let attempts = 0;
  const maxAttempts = 36;

  const timer = setInterval(async () => {
    attempts++;
    try {
      const res = await fetch(`${BACKEND_URL}/api/status?taskId=${encodeURIComponent(taskId)}`);
      const data = await res.json();
      const st = (data.status || '').toUpperCase();

      if (st.includes('SUCCESS') || st === 'COMPLETE'){
        clearInterval(timer);
        const tracks = (data.response && data.response.sunoData) || [];
        renderTracks(tracks);
        status.textContent = tracks.length ? 'गाना तैयार है! 🎉' : 'गाना बना, पर ऑडियो नहीं मिला। कृपया दोबारा कोशिश करें।';
        btn.disabled = false;
      } else if (st.includes('FAIL') || st.includes('ERROR')){
        clearInterval(timer);
        status.textContent = 'गाना बनाने में समस्या आई। दोबारा कोशिश करें।';
        btn.disabled = false;
      } else {
        status.textContent = 'गाना बन रहा है... कृपया इंतज़ार करें।';
      }
    } catch(e){ /* थोड़ी देर बाद फिर कोशिश */ }

    if (attempts >= maxAttempts){
      clearInterval(timer);
      status.textContent = 'समय ज़्यादा लग रहा है। कृपया थोड़ी देर बाद दोबारा कोशिश करें।';
      btn.disabled = false;
    }
  }, 5000);
}

function renderTracks(tracks){
  const result = document.getElementById('result');
  result.innerHTML = '';
  tracks.forEach((t, i) => {
    const url = t.audioUrl || t.streamAudioUrl;
    if(!url) return;
    const wrap = document.createElement('div');
    wrap.className = 'track';
    const titleText = t.title || ('गाना ' + (i + 1));
    wrap.innerHTML = `<p class="track-title">${titleText}</p><audio controls src="${url}"></audio>`;
    result.appendChild(wrap);
  });
}
</script>
</body>
</html>
