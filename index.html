<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SurAI Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a0f1c; --bg2: #241530; --card: rgba(255,255,255,0.06); --card-edge: rgba(255,255,255,0.12);
    --orange: #ff6a3d; --pink: #ff3d7f;
    --text: #f5ecf2; --text-dim: #b8a3b2;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; min-height: 100%; color: var(--text); font-family: 'Hind', sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% -5%, rgba(255,106,61,0.25), transparent 45%),
      radial-gradient(circle at 85% 10%, rgba(255,61,127,0.25), transparent 45%),
      radial-gradient(circle at 50% 60%, rgba(120,70,160,0.2), transparent 55%);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  h1, h2, .brand, button.primary { font-family: 'Baloo 2', sans-serif; }

  .top { position: relative; padding: 44px 20px 24px; text-align: center; }
  .lang-toggle {
    position: absolute; top: 14px; right: 14px; display: flex;
    background: var(--card); border: 1px solid var(--card-edge);
    border-radius: 999px; overflow: hidden; font-family: 'Baloo 2', sans-serif; font-size: 13px; font-weight: 700;
  }
  .lang-toggle button { all: unset; padding: 6px 14px; cursor: pointer; color: var(--text-dim); }
  .lang-toggle button.active { background: linear-gradient(90deg, var(--orange), var(--pink)); color: #fff; }

  .brand { font-size: 28px; font-weight: 800; margin: 0; }
  .tagline { color: var(--text-dim); margin: 8px 0 0; font-size: 14.5px; }

  main { max-width: 560px; margin: 0 auto; padding: 0 18px 48px; }

  .section {
    background: var(--card); border: 1px solid var(--card-edge); border-radius: 18px;
    padding: 16px 16px 14px; margin-top: 14px;
  }
  .section-head { display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: 15px; margin-bottom: 10px; }

  textarea, input {
    width: 100%; padding: 12px 13px; border: 1px solid var(--card-edge); border-radius: 12px;
    background: rgba(0,0,0,0.25); color: var(--text); font-size: 15.5px; font-family: inherit;
  }
  textarea::placeholder, input::placeholder { color: #8a7988; }
  textarea { height: 96px; resize: vertical; }
  textarea:focus, input:focus { outline: 2px solid var(--pink); outline-offset: 1px; }

  .toggle-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 14px; color: var(--text-dim); }
  .toggle-row input { width: auto; accent-color: var(--pink); }

  .more-toggle {
    width: 100%; background: transparent; border: 1px solid var(--card-edge); border-radius: 12px;
    color: var(--text); padding: 11px; font-size: 14.5px; font-family: 'Hind', sans-serif; font-weight: 600;
    margin-top: 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
  }
  #moreOptions { display: none; margin-top: 10px; }
  #moreOptions.open { display: block; }

  button.primary {
    width: 100%; padding: 17px; margin-top: 18px; border: 0; border-radius: 999px;
    background: linear-gradient(90deg, var(--pink), var(--orange));
    color: #fff; font-size: 17px; font-weight: 700; letter-spacing: 0.3px; cursor: pointer;
    box-shadow: 0 10px 26px -8px rgba(255,61,127,0.5);
  }
  button.primary:active { transform: translateY(1px); }
  button.primary:disabled { opacity: 0.6; cursor: not-allowed; }

  .status { margin-top: 14px; font-size: 13.5px; color: var(--text-dim); line-height: 1.6; min-height: 1.4em; }
  .track { margin-top: 14px; padding: 14px; border-radius: 14px; background: rgba(0,0,0,0.25); border: 1px solid var(--card-edge); }
  .track-title { margin: 0 0 8px; font-weight: 600; font-size: 14.5px; }
  .track audio { width: 100%; }

  footer { text-align: center; padding: 10px 20px 30px; color: var(--text-dim); font-size: 12.5px; }
</style>
</head>
<body>

<div class="top">
  <div class="lang-toggle">
    <button id="langHi" class="active" onclick="setLang('hi')">हिं</button>
    <button id="langEn" onclick="setLang('en')">EN</button>
  </div>
  <h1 class="brand">🎵 SurAI Studio</h1>
  <p class="tagline" data-i18n="tagline"></p>
</div>

<main>
  <div class="section">
    <div class="section-head" data-i18n="lyricsHead"></div>
    <textarea id="lyrics" data-i18n-placeholder="lyricsPlaceholder"></textarea>
    <label class="toggle-row">
      <input type="checkbox" id="instrumental">
      <span data-i18n="instrumentalLabel"></span>
    </label>
  </div>

  <div class="section">
    <div class="section-head" data-i18n="styleHead"></div>
    <textarea id="style" data-i18n-placeholder="stylePlaceholder"></textarea>
  </div>

  <button type="button" class="more-toggle" onclick="toggleMore()">
    <span data-i18n="moreOptions"></span><span id="moreArrow">⌄</span>
  </button>
  <div id="moreOptions">
    <input id="title" data-i18n-placeholder="titlePlaceholder">
  </div>

  <button class="primary" id="makeBtn" onclick="makeSong()" data-i18n="submitBtn"></button>
  <p id="status" class="status"></p>
  <div id="result"></div>
</main>

<footer>© 2026 SurAI Studio</footer>

<script>
const BACKEND_URL = '';

const i18n = {
  hi: {
    tagline: 'अपनी आवाज़, अपने बोल — AI से बना अपना गाना',
    lyricsHead: 'बोल (Lyrics)',
    lyricsPlaceholder: 'गाने के बोल लिखें, या सिर्फ़ आइडिया बताएं...',
    instrumentalLabel: 'सिर्फ़ संगीत (बिना आवाज़)',
    styleHead: 'स्टाइल (Styles)',
    stylePlaceholder: 'गाना कैसा सुनाई दे, बताएं — जैसे: DJ, भजन, रोमांटिक...',
    moreOptions: 'और विकल्प',
    titlePlaceholder: 'गाने का नाम (वैकल्पिक)',
    submitBtn: 'गाना बनाएं 🎵',
    needFields: 'कृपया बोल या स्टाइल में से कुछ लिखें।',
    sending: 'रिक्वेस्ट भेजी जा रही है...',
    generating: 'गाना बन रहा है... (30-60 सेकंड लग सकते हैं)',
    waiting: 'गाना बन रहा है... कृपया इंतज़ार करें।',
    done: 'गाना तैयार है! 🎉',
    doneNoAudio: 'गाना बना, पर ऑडियो नहीं मिला। दोबारा कोशिश करें।',
    failed: 'गाना बनाने में समस्या आई। दोबारा कोशिश करें।',
    timeout: 'समय ज़्यादा लग रहा है। थोड़ी देर बाद दोबारा कोशिश करें।',
    networkErr: 'नेटवर्क एरर, दोबारा कोशिश करें।',
    genericErr: 'कुछ गलत हुआ, दोबारा कोशिश करें।',
    trackFallback: 'गाना'
  },
  en: {
    tagline: 'Your voice, your words — a song made with AI',
    lyricsHead: 'Lyrics',
    lyricsPlaceholder: 'Write lyrics, or just a prompt/idea...',
    instrumentalLabel: 'Instrumental only (no vocals)',
    styleHead: 'Styles',
    stylePlaceholder: 'Describe what you want your song to sound like — DJ, devotional, romantic...',
    moreOptions: 'More Options',
    titlePlaceholder: 'Song title (optional)',
    submitBtn: 'Create 🎵',
    needFields: 'Please fill in lyrics or style.',
    sending: 'Sending request...',
    generating: 'Creating your song... (30-60 seconds)',
    waiting: 'Creating your song... please wait.',
    done: 'Your song is ready! 🎉',
    doneNoAudio: 'Song created, but no audio was found. Please try again.',
    failed: 'Something went wrong. Please try again.',
    timeout: 'Taking longer than expected. Please try again shortly.',
    networkErr: 'Network error, please try again.',
    genericErr: 'Something went wrong, please try again.',
    trackFallback: 'Song'
  }
};

let currentLang = 'hi';

function setLang(lang){
  currentLang = lang;
  document.documentElement.lang = lang;
  document.getElementById('langHi').classList.toggle('active', lang === 'hi');
  document.getElementById('langEn').classList.toggle('active', lang === 'en');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = i18n[lang][el.getAttribute('data-i18n')];
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    el.placeholder = i18n[lang][el.getAttribute('data-i18n-placeholder')];
  });
}
setLang('hi');

function toggleMore(){
  const el = document.getElementById('moreOptions');
  const arrow = document.getElementById('moreArrow');
  el.classList.toggle('open');
  arrow.textContent = el.classList.contains('open') ? '⌃' : '⌄';
}

async function makeSong(){
  const t = i18n[currentLang];
  const lyrics = document.getElementById('lyrics').value.trim();
  const style = document.getElementById('style').value.trim();
  const title = document.getElementById('title').value.trim();
  const instrumental = document.getElementById('instrumental').checked;
  const status = document.getElementById('status');
  const btn = document.getElementById('makeBtn');
  const result = document.getElementById('result');

  if(!lyrics && !style){
    status.textContent = t.needFields;
    return;
  }

  result.innerHTML = '';
  btn.disabled = true;
  status.textContent = t.sending;

  try {
    const res = await fetch(`${BACKEND_URL}/api/generate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lyrics, style, title, instrumental })
    });
    const data = await res.json();
    if(!res.ok || !data.taskId){
      status.textContent = (data.error || t.genericErr);
      btn.disabled = false;
      return;
    }
    status.textContent = t.generating;
    pollStatus(data.taskId);
  } catch(err){
    status.textContent = t.networkErr;
    btn.disabled = false;
  }
}

function pollStatus(taskId){
  const t = i18n[currentLang];
  const status = document.getElementById('status');
  const btn = document.getElementById('makeBtn');
  let attempts = 0;
  const maxAttempts = 36;

  const timer = setInterval(async () => {
    attempts++;
    try {
      const res = await fetch(`${BACKEND_URL}/api/status?taskId=${encodeURIComponent(taskId)}`);
      const data = await res.json();
      const st = (data.status || '').toUpperCase();

      if (st.includes('SUCCESS') || st === 'COMPLETE'){
        clearInterval(timer);
        const tracks = (data.response && data.response.sunoData) || [];
        renderTracks(tracks);
        status.textContent = tracks.length ? t.done : t.doneNoAudio;
        btn.disabled = false;
      } else if (st.includes('FAIL') || st.includes('ERROR')){
        clearInterval(timer);
        status.textContent = t.failed;
        btn.disabled = false;
      } else {
        status.textContent = t.waiting;
      }
    } catch(e){ /* retry on next tick */ }

    if (attempts >= maxAttempts){
      clearInterval(timer);
      status.textContent = t.timeout;
      btn.disabled = false;
    }
  }, 5000);
}

function renderTracks(tracks){
  const t = i18n[currentLang];
  const result = document.getElementById('result');
  result.innerHTML = '';
  tracks.forEach((trk, i) => {
    const url = trk.audioUrl || trk.streamAudioUrl;
    if(!url) return;
    const wrap = document.createElement('div');
    wrap.className = 'track';
    const titleText = trk.title || (t.trackFallback + ' ' + (i + 1));
    wrap.innerHTML = `<p class="track-title"></p><audio controls src="${url}"></audio>`;
    wrap.querySelector('.track-title').textContent = titleText;
    result.appendChild(wrap);
  });
}
</script>
</body>
</html>
